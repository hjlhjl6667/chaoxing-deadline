<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>面板预览</title>
<style>
  html,body{margin:0;height:100%}
  body{
    background:#f2f4f8;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .fake-page{
    padding:28px 34px;color:#b9c1d0;font-size:13px;line-height:2.1;
    max-width:520px;
  }
  .fake-page b{color:#8f9aad;font-weight:600;font-size:15px;display:block;margin-bottom:14px}
  /* 故意模拟学习通那种「压扁按钮」的恶意样式，用来验证隔离是否生效 */
  button{height:10px;line-height:0;overflow:hidden;letter-spacing:-2px}
</style>
<script>
/* ---- 模拟油猴环境 ---- */
(function () {
  const store = {};
  const now = Date.now();
  const H = 3600e3, D = 24 * H;
  const mk = (o) => Object.assign({ expired: false, isPeer: false, url: '#' }, o);

  store['cxd_scan_v1'] = {
    at: now - 42e3,
    courseCount: 12,
    warnings: [],
    diag: [
      { name: '高等数学 A（上）', ok: true, count: 3, retired: false },
      { name: '数据结构', ok: true, count: 4, retired: false },
      { name: '马克思主义基本原理', ok: true, count: 2, retired: false },
      { name: '大学英语（三）', ok: true, count: 2, retired: false },
      { name: '线性代数', ok: true, count: 1, retired: false },
      { name: '概率论与数理统计', ok: true, count: 1, retired: false },
      { name: '大学物理（下）', ok: true, count: 0, retired: false },
      { name: 'C 语言程序设计', ok: true, count: 0, retired: true },
      { name: '思想道德与法治', ok: false, count: 0, error: '未能提取 workEnc' },
    ],
    items: [
      mk({ uid: 'a1', kind: 'homework', courseName: '高等数学 A（上）',
        title: '第三章 导数与微分 课后习题（第 12—28 题）', status: '未交',
        category: 'pending', deadline: now + 2 * H + 7 * 60e3 }),
      mk({ uid: 'a2', kind: 'homework', courseName: '数据结构',
        title: '实验二：二叉树遍历与哈夫曼编码', status: '未交',
        category: 'pending', deadline: now + 18 * H }),
      mk({ uid: 'a3', kind: 'homework', courseName: '马克思主义基本原理',
        title: '第二章 思考题 · 提交后需互评 3 份', status: '待互评',
        category: 'peerreview', deadline: now + 30 * H, isPeer: true }),
      mk({ uid: 'a4', kind: 'homework', courseName: '大学英语（三）',
        title: 'Unit 5 Writing Task: Argumentative Essay', status: '未交',
        category: 'pending', deadline: now + 2 * D + 8 * H }),
      mk({ uid: 'a5', kind: 'exam', courseName: '',
        title: '线性代数 期中考试（闭卷 90 分钟）', status: '未开始',
        category: 'pending', deadline: now + 6 * D + 3 * H }),
      mk({ uid: 'a6', kind: 'homework', courseName: '概率论与数理统计',
        title: '第四章 大数定律与中心极限定理', status: '未交',
        category: 'pending', deadline: now + 11 * D }),
      mk({ uid: 'a7', kind: 'notice', courseName: '数据结构 · 李老师',
        title: '关于实验课调至周四下午的通知', status: '未读',
        category: 'notice', deadline: null }),
      // 待批阅：前两条应保留，后两条应被「30 天」规则隐藏
      mk({ uid: 'g1', kind: 'homework', courseName: '大学英语（三）',
        title: 'Unit 4 Summary Writing', status: '待批阅',
        category: 'grading', deadline: now - 4 * D }),
      mk({ uid: 'g4', kind: 'homework', courseName: '线性代数',
        title: '第二次平时作业', status: '待批阅',
        category: 'grading', deadline: null }),
      mk({ uid: 'g2', kind: 'homework', courseName: '高等数学 A（上）',
        title: '第二章 极限与连续 课后习题', status: '待批阅',
        category: 'grading', deadline: now - 46 * D }),
      mk({ uid: 'g3', kind: 'homework', courseName: '马克思主义基本原理',
        title: '第一章 思考题', status: '待批阅',
        category: 'grading', deadline: null }),
    ],
  };

  // g3 没有截止时间，靠「首次扫到的时间」判断：68 天前就已经躺在那儿了
  store['cxd_seen_v1'] = { g1: now - 4 * D, g2: now - 46 * D, g3: now - 68 * D, g4: now - 3 * D };

  window.GM_addStyle = function (css) {
    const s = document.createElement('style');
    s.textContent = css;
    document.head.appendChild(s);
  };
  window.GM_getValue = function (k, d) { return k in store ? store[k] : d; };
  window.GM_setValue = function (k, v) { store[k] = v; };
  window.GM_xmlhttpRequest = function () { /* 预览时不发请求 */ };
})();
</script>
</head>
<body>
<div class="fake-page">
  <b>学习通 · 课程首页（模拟背景）</b>
  这里是被脚本覆盖的真实页面。面板浮在右下角，不遮挡正文。<br>
  本页顶部故意加了一条「按钮高度 10px、行高 0」的恶意样式，
  用来验证脚本的 Shadow DOM 隔离是否真的把它挡住了。
</div>

<script src="../chaoxing-deadline.user.js"></script>
<script>
  // UI 挂在 Shadow DOM 里，必须穿透 shadowRoot 才能找到面板
  setTimeout(function () {
    var host = document.getElementById('cxd-host');
    var root = host && host.shadowRoot;
    if (!root) return;
    var panel = root.querySelector('.cxd-panel');
    if (panel) panel.classList.add('open');
    if (location.search.indexOf('diag') >= 0) {
      var btn = root.querySelector('#cxd-diag-btn');
      if (btn) btn.click();
    }
    if (location.search.indexOf('grading') >= 0) {
      var tabs = root.querySelectorAll('.cxd-tab');
      for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].textContent.indexOf('待批阅') === 0) { tabs[i].click(); break; }
      }
    }
    if (location.search.indexOf('settings') >= 0) {
      var sb = root.querySelector('#cxd-set-btn');
      if (sb) sb.click();
    }
  }, 150);
</script>
</body>
</html>
